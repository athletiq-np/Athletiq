<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Athletiq</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        
        .offline-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .offline-subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .offline-features {
            text-align: left;
            margin: 30px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
        }
        
        .offline-features h3 {
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .feature-list {
            list-style: none;
        }
        
        .feature-list li {
            padding: 8px 0;
            display: flex;
            align-items: center;
        }
        
        .feature-list li::before {
            content: "✓";
            color: #4ade80;
            font-weight: bold;
            margin-right: 10px;
            font-size: 16px;
        }
        
        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .retry-button:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }
        
        .network-status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .network-status.online {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid rgba(74, 222, 128, 0.5);
        }
        
        .network-status.offline {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .offline-title {
                font-size: 24px;
            }
            
            .offline-subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon pulse">
            📡
        </div>
        
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-subtitle">Don't worry! Some features are still available while you're offline.</p>
        
        <div class="offline-features">
            <h3>📱 Available Offline</h3>
            <ul class="feature-list">
                <li>View cached tournament data</li>
                <li>Browse athlete profiles</li>
                <li>Review recent notifications</li>
                <li>Access help documentation</li>
                <li>Use the search feature</li>
            </ul>
        </div>
        
        <button class="retry-button" onclick="checkConnection()">
            🔄 Check Connection
        </button>
        
        <button class="retry-button" onclick="goHome()">
            🏠 Go to Dashboard
        </button>
        
        <div class="network-status offline" id="networkStatus">
            📶 Network Status: Offline
        </div>
    </div>

    <script>
        // Check network status
        function updateNetworkStatus() {
            const statusElement = document.getElementById('networkStatus');
            if (navigator.onLine) {
                statusElement.textContent = '📶 Network Status: Online';
                statusElement.className = 'network-status online';
                
                // Auto-retry when back online
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } else {
                statusElement.textContent = '📶 Network Status: Offline';
                statusElement.className = 'network-status offline';
            }
        }
        
        // Check connection manually
        function checkConnection() {
            updateNetworkStatus();
            
            if (navigator.onLine) {
                // Try to reload the page
                window.location.reload();
            } else {
                // Show feedback
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = '❌ Still Offline';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            }
        }
        
        // Go to cached home page
        function goHome() {
            try {
                // Try to navigate to cached dashboard
                window.location.href = '/admin';
            } catch (error) {
                console.log('Navigation failed:', error);
            }
        }
        
        // Listen for network status changes
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        
        // Initial status check
        updateNetworkStatus();
        
        // Periodic connection check (every 30 seconds)
        setInterval(() => {
            if (navigator.onLine) {
                // Ping server to verify actual connectivity
                fetch('/api/health', { 
                    method: 'HEAD',
                    cache: 'no-cache'
                })
                .then(response => {
                    if (response.ok) {
                        window.location.reload();
                    }
                })
                .catch(() => {
                    // Still offline
                });
            }
        }, 30000);
        
        // Service Worker messaging
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data.type === 'NETWORK_AVAILABLE') {
                    updateNetworkStatus();
                }
            });
        }
        
        console.log('Offline page loaded successfully');
    </script>
</body>
</html>
