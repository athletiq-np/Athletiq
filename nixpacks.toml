[phases.setup]
nixPkgs = ["python3", "postgresql_16.dev", "gcc"]

[phases.build]
cmds = [
  "cd athletiq_django",
  "pip install -r requirements.txt",
  "python manage.py collectstatic --noinput",
  "python manage.py migrate --noinput"
]

[start]
cmd = "cd athletiq_django && gunicorn athletiq.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120 --log-file -"