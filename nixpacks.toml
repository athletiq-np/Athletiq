[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "postgresql_16.dev", "gcc"]

[phases.build]
cmds = [
  "cd athletiq_django && python manage.py collectstatic --noinput"
]

[start]
cmd = "cd athletiq_django && gunicorn athletiq.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120 --log-file -"