name: Deploy to Production

on:
  push:
    branches: [ main, master, rahul-test ]
  pull_request:
    branches: [ main, master, rahul-test ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_athletiq
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd athletiq_django
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_athletiq
        DEBUG: True
        SECRET_KEY: test-secret-key-for-ci
        ALLOWED_HOSTS: localhost,127.0.0.1
        DJANGO_SETTINGS_MODULE: athletiq.settings
      run: |
        cd athletiq_django
        python manage.py migrate --noinput
        python manage.py test

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: athletiq-frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd athletiq-frontend
        npm ci
    
    - name: Run tests
      run: |
        cd athletiq-frontend
        npm test -- --coverage --watchAll=false
    
    - name: Build frontend
      run: |
        cd athletiq-frontend
        npm run build

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rahul-test'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Railway
      if: github.ref == 'refs/heads/rahul-test'
      run: |
        echo "✅ Railway deployment triggered automatically via GitHub integration"
        echo "🚀 Branch: rahul-test"
        echo "🌐 URL: https://athletiq.railway.app"
        echo "🔍 Health check will be available at: https://athletiq.railway.app/health/"
    
    - name: Notify Deployment Status
      if: github.ref == 'refs/heads/rahul-test'
      run: |
        echo "📊 Deployment Summary:"
        echo "- Backend: Django + PostgreSQL"
        echo "- Frontend: React (separate deployment)"
        echo "- Environment: Production"
        echo "- Health Check: /health/"
        echo "- Admin Panel: /admin/"