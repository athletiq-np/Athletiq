version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: athletiq
      POSTGRES_USER: athletiq_user
      POSTGRES_PASSWORD: athletiq_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://athletiq_user:athletiq_password@db:5432/athletiq
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    depends_on:
      - db
      - redis
    volumes:
      - ./athletiq_django/media:/app/media
      - ./athletiq_django/static:/app/static

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: