<!DOCTYPE html>
<html>
<head>
    <title>Test School Registration with Logo</title>
</head>
<body>
    <h2>Test School Registration with Logo</h2>
    <form id="schoolForm" enctype="multipart/form-data">
        <div>
            <label>School Name:</label>
            <input type="text" name="name" value="Test Logo School" required>
        </div>
        <div>
            <label>Address:</label>
            <input type="text" name="address" value="Logo Test Address" required>
        </div>
        <div>
            <label>Country:</label>
            <input type="text" name="country" value="Nepal" required>
        </div>
        <div>
            <label>Province:</label>
            <input type="text" name="province" value="Bagmati" required>
        </div>
        <div>
            <label>District:</label>
            <input type="text" name="district" value="Kathmandu" required>
        </div>
        <div>
            <label>City:</label>
            <input type="text" name="city" value="Kathmandu" required>
        </div>
        <div>
            <label>Phone:</label>
            <input type="text" name="phone" value="+9771234567890" required>
        </div>
        <div>
            <label>Email:</label>
            <input type="email" name="email" value="logotest@test.com" required>
        </div>
        <div>
            <label>Principal Name:</label>
            <input type="text" name="principal_name" value="Logo Test Principal" required>
        </div>
        <div>
            <label>Admin Name:</label>
            <input type="text" name="admin_name" value="Logo Admin" required>
        </div>
        <div>
            <label>Admin Email:</label>
            <input type="email" name="admin_email" value="logoadmin@test.com" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password" value="testpass123" required>
        </div>
        <div>
            <label>Logo:</label>
            <input type="file" name="logo" accept="image/*">
        </div>
        <br>
        <button type="submit">Create School</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('schoolForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('http://localhost:8000/api/schools/register/', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = `
                    <h3>Response:</h3>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h3>Error:</h3>
                    <pre>${error.message}</pre>
                `;
            }
        });
    </script>
</body>
</html>
