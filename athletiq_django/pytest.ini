[pytest]
django_find_project = true
testpaths = tests
python_files = test_*.py
addopts = -v --cov=./ --cov-report=term-missing --cov-report=html --reuse-db
pythonpath = .
DJANGO_SETTINGS_MODULE = athletiq_django.settings

[coverage:run]
source = .
omit =
    */migrations/*
    */tests/*
    */__init__.py
    */admin.py
    */apps.py
    */urls.py
    */wsgi.py
    */asgi.py
    */settings/*
    manage.py
    */test_*.py
    */validate_*.py

[coverage:report]
show_missing = true
skip_covered = true
fail_under = 90

exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain if tests don't hit defensive assertion code:
    raise NotImplementedError
    raise ImportError
    if __name__ == .__main__.:
        raise
    pass
    raise AssertionError
    raise NotImplemented
    @abc.abstractmethod
    def __repr__
    def __str__
    def __unicode__
    def __repr__
    def __str__
    def __unicode__
    raise NotImplementedError
